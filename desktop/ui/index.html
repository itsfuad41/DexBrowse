<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; frame-src 'self' file: http: https:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DexBrowse By Fuad</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="newtab" class="icon" title="New tab (Ctrl+T)"></button>
    <span id="privbadge" hidden>Private</span>
  </div>

  <div id="toolbar">
    <button id="back" class="icon" title="Back (Alt+Left)"></button>
    <button id="forward" class="icon" title="Forward (Alt+Right)"></button>
    <button id="reload" class="icon" title="Reload (Ctrl+R)"></button>
    <div id="addrwrap">
      <span id="siteicon" class="icon"></span>
      <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
      <button id="star" class="icon" title="Bookmark this page (Ctrl+D)"></button>
    </div>
    <button id="shieldbtn" class="icon" title="Shields"><span id="shieldcount" class="badge" hidden></span></button>
    <span id="extpins"></span>
    <button id="extbtn" class="icon" title="Extensions"></button>
    <button id="uabtn" class="icon" title="User agent"></button>
    <button id="profbtn" title="Profiles"></button>
    <button id="menubtn" class="icon" title="Menu"></button>
  </div>

  <div id="bmbar" hidden></div>

  <div id="findbar" hidden>
    <input id="findinput" type="text" placeholder="Find in page" spellcheck="false">
    <span id="findcount"></span>
    <button id="findprev" class="icon" title="Previous (Shift+Enter)"></button>
    <button id="findnext" class="icon" title="Next (Enter)"></button>
    <button id="findclose" class="icon" title="Close (Esc)"></button>
  </div>

  <div id="extbar" hidden>
    <span id="exttext"></span>
    <button id="extadd" class="primary">Add to DexBrowse</button>
    <button id="extclose" class="icon" title="Dismiss"></button>
  </div>

  <div id="gbar" hidden>
    <span>Google refused to sign you in inside this browser. You can finish signing in with your default browser instead.</span>
    <button id="gopen" class="primary">Open in default browser</button>
    <button id="gclose" class="icon" title="Dismiss"></button>
  </div>

  <div id="savebar" hidden>
    <span id="savetext"></span>
    <button id="savego" class="primary">Save</button>
    <button id="savenever">Never for this site</button>
    <button id="savelater" class="icon" title="Not now"></button>
  </div>

  <div id="progress"></div>
  <div id="views">
    <div id="splitbar" hidden><button id="splitswap" title="Swap sides">⇄</button><button id="splitclose" title="Exit split view">✕</button></div>
    <div id="settings" hidden></div>
  </div>

  <aside id="panel" hidden>
    <header>
      <h2 id="panel-title"></h2>
      <button id="panel-close" class="icon" title="Close"></button>
    </header>
    <div id="panel-body"></div>
  </aside>

  <div id="shields-pop" class="pop" hidden></div>
  <div id="menu" class="pop" hidden></div>
  <div id="ext-pop" class="pop" hidden></div>
  <div id="ua-pop" class="pop" hidden></div>
  <div id="suggest" class="pop" hidden></div>
  <div id="editdlg" class="pop" hidden>
    <b>Edit bookmark</b>
    <input id="ed-title" type="text" placeholder="Title" spellcheck="false">
    <input id="ed-url" type="text" placeholder="Address" spellcheck="false">
    <select id="ed-folder"></select>
    <div class="row"><button id="ed-cancel">Cancel</button><button id="ed-save" class="primary">Save</button></div>
  </div>
  <div id="bmpop" class="pop" hidden></div>
  <div id="prof-pop" class="pop" hidden></div>
  <div id="ctx" class="pop" hidden></div>

  <div id="lock" hidden>
    <div class="lockbox">
      <img id="lockicon" src="icon.png" alt="DexBrowse" width="64" height="64">
      <h1>DexBrowse is locked</h1>
      <p id="locksub">Type the passcode of the profile you want to open</p>
      <input id="lockinput" type="password" placeholder="Passcode" autocomplete="off">
      <div id="lockerr"></div>
      <button id="lockgo" class="primary">Unlock</button>
    </div>
  </div>

  <div id="updatebar" hidden>
    <span id="updatetext"></span>
    <button id="updatego" class="primary">Restart to update</button>
    <button id="updateclose" class="icon" title="Later"></button>
  </div>

  <div id="toast" hidden></div>
  <script src="app.js"></script>
  <script src="extras.js"></script>
  <script src="settings.js"></script>
</body>
</html>
