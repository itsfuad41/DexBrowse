name: Build DexBrowse PC

on:
  push:
    branches:
      - main
      - refs
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEXBROWSE_GOOGLE_CLIENT_ID: ${{ secrets.DEXBROWSE_GOOGLE_CLIENT_ID }}
          DEXBROWSE_GOOGLE_CLIENT_SECRET: ${{ secrets.DEXBROWSE_GOOGLE_CLIENT_SECRET }}
          DEXBROWSE_FIREBASE_API_KEY: ${{ secrets.DEXBROWSE_FIREBASE_API_KEY }}
          DEXBROWSE_FIREBASE_PROJECT_ID: ${{ secrets.DEXBROWSE_FIREBASE_PROJECT_ID }}
        run: npm run dist

      - name: Check exe icon
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path "desktop/dist/win-unpacked/DexBrowse.exe").Path
          $bmp = [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap()
          $c = $bmp.GetPixel([int]($bmp.Width / 2), [int]($bmp.Height - 4))
          Write-Host "exe icon sample pixel: $($c.R),$($c.G),$($c.B) (DexBrowse icon base is light, Electron default is not)"
          if ($c.A -eq 0) { Write-Host "::warning::exe icon sample is transparent" }

      - name: Verify installer
        shell: bash
        run: |
          ls -la desktop/dist
          test -f desktop/dist/DexBrowse-PC-Setup.exe
          test -f desktop/dist/latest.yml

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DexBrowse-PC-Windows
          path: |
            desktop/dist/DexBrowse-PC-Setup.exe
            desktop/dist/DexBrowse-PC-Setup.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

      - name: Read version
        id: ver
        shell: bash
        run: |
          echo "name=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: DexBrowse ${{ steps.ver.outputs.name }}
          files: |
            desktop/dist/DexBrowse-PC-Setup.exe
            desktop/dist/DexBrowse-PC-Setup.exe.blockmap
            desktop/dist/latest.yml
          generate_release_notes: true
