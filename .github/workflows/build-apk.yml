name: Build DexBrowse APK

on:
  push:
    branches:
      - main
      - refs
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Require signing keystore
        run: |
          if [ ! -f keystore/dexbrowse.jks ]; then
            echo "::error::keystore/dexbrowse.jks is missing from the repo. Without it every build gets a NEW random signing key and Android will say App not installed."
            exit 1
          fi

      - name: Generate DexBrowse Project
        run: |
          python3 generate_project.py

      - name: Install Gradle 8.7
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build APK
        env:
          DEXBROWSE_GOOGLE_CLIENT_ID: ${{ secrets.DEXBROWSE_GOOGLE_CLIENT_ID }}
          DEXBROWSE_GOOGLE_CLIENT_SECRET: ${{ secrets.DEXBROWSE_GOOGLE_CLIENT_SECRET }}
          DEXBROWSE_FIREBASE_API_KEY: ${{ secrets.DEXBROWSE_FIREBASE_API_KEY }}
          DEXBROWSE_FIREBASE_PROJECT_ID: ${{ secrets.DEXBROWSE_FIREBASE_PROJECT_ID }}
        run: |
          set +e
          gradle clean assembleRelease --stacktrace > build.log 2>&1
          status=$?
          tail -n 80 build.log
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E "^e: |What went wrong|error:" -A2 build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | head -40 | tr '\n' '|')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $status

      - name: Show APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | grep -E "SHA-256|Verifies" || true

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          mkdir -p output

          cp "$APK" output/DexBrowse-By-Fuad.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexBrowse-APK
          path: output/DexBrowse-By-Fuad.apk
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/DexBrowse-By-Fuad.apk
          generate_release_notes: true
